[workspace]
members = ["crates/bd-client"]
resolver = "3"

[package]
name = "kde_beads"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A native KDE viewer for Beads issue trackers"
license = "MIT"

[[bin]]
name = "kde-beads"
path = "src/main.rs"

[dependencies]
bd-client = { path = "crates/bd-client" }
qtbridge = { version = "0.2.0", features = ["serde_json"] }
serde = "1.0"
serde_json = "1.0"
url = "2.5"
