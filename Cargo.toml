[workspace]
members = ["crates/bd-client"]
resolver = "3"

[package]
name = "knecklace"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A native KDE viewer for Beads repositories"
license = "MIT"

[[bin]]
name = "knecklace"
path = "src/main.rs"

[dependencies]
bd-client = { path = "crates/bd-client" }
qtbridge = { version = "0.2.0", features = ["serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
url = "2.5"
